<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>{% block title %}Chilavu{% endblock %}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="/static/daily/icons/favicon-48.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/static/daily/icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="/static/daily/icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-title" content="Chilavu">
<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js",{scope:"/"}).catch(function(){})});</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface2:#f1f2f7; --line:#eceef4;
  --text:#0f1222; --muted:#7b8094; --soft:#a6abbd;
  --primary:#1b3a8f; --primary-2:#2f5bd6; --primary-soft:#e8eefc; --brand-green:#16c25f; --brand-green-2:#3ee06b; --navy-deep:#0b1a4a;
  --green:#12b76a; --green-soft:#e7f8ef; --red:#f04463; --red-soft:#fdecef; --amber:#f5a524;
  --r-lg:24px; --r:18px; --r-sm:14px;
  --sh-1:0 1px 2px rgba(16,18,40,.04),0 2px 8px rgba(16,18,40,.04);
  --sh-2:0 2px 4px rgba(16,18,40,.04),0 12px 32px -8px rgba(16,18,40,.12);
  --sh-p:0 10px 24px -8px rgba(27,58,143,.55);
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#121212; --surface2:#1c1c1c; --line:#262626;
  --text:#f5f5f5; --muted:#a3a3a3; --soft:#6b6b6b; --primary:#5b84f5; --primary-2:#7a9bff; --primary-soft:#1f1f1f;
  --green-soft:#10291e; --red-soft:#2d151b;
  --sh-1:none; --sh-2:0 12px 32px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.btn{border:0;border-radius:var(--r);padding:15px 20px;font-weight:700;font-size:15px;color:#fff;
  background:linear-gradient(145deg,var(--primary-2),var(--primary));box-shadow:var(--sh-p);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.field{width:100%;padding:14px 16px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);
  outline:none;font-size:16px;transition:border-color .15s,box-shadow .15s}
.field:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
{% block css %}{% endblock %}
</style>
</head>
<body>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'}catch(e){}
/* after logout: remove this account's data cached on the device */
if(/[?&]bye=1/.test(location.search)){
  try{["cacheTX","cacheWallet","cacheLoans","outbox","lockOn","lockPin","lockBio","lockSalt","installDismissed"].forEach(function(k){localStorage.removeItem(k)})}catch(e){}
  try{caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}catch(e){}
  history.replaceState(null,"",location.pathname);
}</script>

<!-- Apple-style "hello" intro (once per visit) -->
<div id="intro" aria-hidden="true">
  <img class="imark" src="/static/daily/icons/logo-mark.png" alt="">
  <svg viewBox="0 0 600 200" class="hello">
    <defs>
      <linearGradient id="hg" x1="0" x2="1">
        <stop offset="0" stop-color="#0b1a4a"/><stop offset=".5" stop-color="#1b3a8f"/>
        <stop offset=".82" stop-color="#0f9a52"/><stop offset="1" stop-color="#16c25f"/>
      </linearGradient>
    </defs>
    <text x="50%" y="150" text-anchor="middle" class="hw">Chilavu</text>
  </svg>
  <div class="tag" id="introTag" data-user="{% if user.is_authenticated %}{{ user.username|title }}{% endif %}">Track every rupee, every day</div>
</div>
<style>
#intro{position:fixed;inset:0;z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;background:var(--bg)}
/* plain background first (same as Android's splash), soft glow fades in */
#intro::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 360px at 50% 40%,var(--primary-soft),transparent 70%);
  opacity:0;animation:glowIn 1.2s ease .5s forwards;pointer-events:none;z-index:-1}
@keyframes glowIn{to{opacity:1}}
.intro-on #intro{display:flex}
.intro-on body{overflow:hidden}
.intro-on body>*:not(#intro),.intro-on body>*:not(#intro) *{animation-play-state:paused!important}
#intro .hello{display:block;width:min(84vw,460px);overflow:visible;margin-top:22px}
/* icon starts big in the screen centre (where the splash icon was), then glides up */
#intro .imark{position:relative;width:76px;height:76px;border-radius:22px;box-shadow:0 18px 40px -12px rgba(20,40,120,.45);
  transform:translateY(var(--dy,0px)) scale(1.6);animation:imUp .9s cubic-bezier(.65,0,.25,1) .25s forwards}
@keyframes imUp{60%{transform:translateY(-6px) scale(.96)}100%{transform:none}}
#intro .hw{font-family:"Dancing Script",cursive;font-weight:700;font-size:140px;fill:url(#hg);fill-opacity:0;
  stroke:url(#hg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400;
  animation:hwDraw 2s cubic-bezier(.55,.1,.35,1) .75s forwards,hwFill .5s ease 2.45s forwards}
#intro .tag{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:14px;
  opacity:0;animation:mlIn .7s ease 2.7s forwards}
#intro.bye{animation:introOut .8s cubic-bezier(.7,0,.3,1) forwards}
/* dark mode: brighter blue-to-green handwriting so it reads on the dark background */
:root[data-theme="dark"] #hg stop:nth-child(1){stop-color:#8fb0ff}
:root[data-theme="dark"] #hg stop:nth-child(2){stop-color:#6d93ff}
:root[data-theme="dark"] #hg stop:nth-child(3){stop-color:#34d27a}
:root[data-theme="dark"] #hg stop:nth-child(4){stop-color:#5af08e}
:root[data-theme="dark"] #intro .tag{color:#a3a9bd}
:root[data-theme="dark"] #intro::before{background:radial-gradient(600px 360px at 50% 40%,rgba(255,255,255,.06),transparent 70%)}
:root[data-theme="dark"] #intro .imark{box-shadow:0 18px 40px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08)}
@keyframes hwDraw{to{stroke-dashoffset:0}}
@keyframes hwFill{to{fill-opacity:1;stroke-width:.6}}
@keyframes mlIn{to{opacity:1;filter:blur(0);transform:none}}
@keyframes introOut{to{opacity:0;transform:scale(1.12);filter:blur(10px);visibility:hidden}}
</style>
<script>
(function(){
  var show=false;
  var p=location.pathname,authPage=p.indexOf("/signin")===0||p.indexOf("/signup")===0||p.indexOf("/forgot")===0,justIn=false,isNew=false;
  try{
    var js=sessionStorage.getItem("justSignedIn");justIn=!authPage&&!!js;isNew=js==="new";
    if(!authPage)sessionStorage.removeItem("justSignedIn");
    // play on every open / reload; skip only when a sign-in or sign-up attempt was just rejected
    show=!(authPage&&js)&&!matchMedia("(prefers-reduced-motion: reduce)").matches;
  }catch(e){}
  if(show&&justIn){var tg=document.getElementById("introTag"),nm=tg.getAttribute("data-user");tg.textContent=(isNew?"Welcome":"Welcome back")+(nm?", "+nm:"")}
  if(!show){document.getElementById("intro").remove();return}
  document.documentElement.classList.add("intro-on");
  var el=document.getElementById("intro"),done=false;
  // start the icon at the exact screen centre, where Android's splash icon sits
  var im=el.querySelector(".imark");
  if(im){var r=im.getBoundingClientRect();im.style.setProperty("--dy",(innerHeight/2-(r.top+r.height/2))+"px")}
  function end(){if(done)return;done=true;el.classList.add("bye");setTimeout(function(){document.documentElement.classList.remove("intro-on");el.remove()},800)}
  el.addEventListener("click",end);           // tap to skip
  setTimeout(end,3900);
})();
</script>

{% block body %}{% endblock %}
{% block js %}{% endblock %}
</body>
</html>
